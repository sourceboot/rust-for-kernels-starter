# The calls this course forbids in the kit, read by `cargo clippy` through
# CLIPPY_CONF_DIR (.cargo/config.toml `[env]`) so it is OUR list, not one a learner's
# own `clippy.toml` could displace — measured on rust-for-beginners: dropping an empty
# `disallowed-methods = []` into the learner's tree changes nothing, and removing the
# CLIPPY_CONF_DIR line makes this file invisible.
#
# WHAT IT IS FOR HERE (rust-for-kernels v2, 2026-10-07; the list is rust-for-systems'
# and rust-for-beginners', the reasoning is this course's). The kit is `no_std` except
# under its own test harness, and the course's checks never link it into the test
# process: every lab's own tests start a child program, the only binary that links the
# kit, and recompute every expectation themselves. So a kit that ended the process, wrote a file or started
# a program could only do that to the CHILD, whose early exit the parent reports as a
# failed run. This list is the second line behind that boundary, not the first: it keeps
# the kit's host code from reaching for `std::process`/`std::fs` at all — nothing the
# course teaches goes near them (the kit's `std` is the test harness's, not a
# dependency) — and it says so to the learner in clippy's own words.
#
# What it does NOT see, stated rather than hidden. The lint run is `-p kit --lib`, so
# the kit's tests, `bare` and `xtask` are never in its view (`bare` cannot be: it is
# `no_std` for another triple; `xtask` is lab 08's host tool and runs only under the
# learner's own `cargo xtask`). And `unsafe` is this course's subject, so there is no
# `-Funsafe_code` behind this list as there is in rust-for-systems: an `unsafe` route
# around a name (an `extern "C"` shim, a transmuted pointer) is contained by the process
# boundary above and by `clippy::undocumented_unsafe_blocks`, forced on the same lint
# line, which makes every `unsafe` block carry a `// SAFETY:` line a reviewer reads.
# A check that reads a source file reads the bytes that were compiled, not a file a test
# rewrote afterwards, so a kit test that edits the tree after the build changes nothing
# either.
#
# `reason` is rendered to the learner verbatim inside clippy's own error, so each one
# says what the rule protects in plain words — and none of them quotes a check (a hint
# never echoes a rubric).
#
# `allow-invalid = true` on the platform-specific paths: `std::os::windows::…` does not
# resolve on a Mac and `std::os::unix::…` does not resolve on Windows, and without it
# clippy fails on the path it cannot find rather than on the call it was asked to catch.
#
# `std::process::Command::new` alone covers the whole Command family: it is the only
# constructor, so `.spawn()`, `.output()`, `.status()` and `CommandExt::exec` all need
# it first.

disallowed-methods = [
  { path = "std::process::exit", reason = "a test run must end when its tests end" },
  # abort is NOT covered by clippy::exit and dies with SIGABRT rather than a code
  # — the one spelling the lint-gate red team found still open (N1).
  { path = "std::process::abort", reason = "a test run must end when its tests end" },
  { path = "std::process::Command::new", reason = "the library starts no programs" },
  { path = "std::fs::write", reason = "the library writes no files" },
  { path = "std::fs::copy", reason = "the library writes no files" },
  { path = "std::fs::rename", reason = "the library writes no files" },
  { path = "std::fs::remove_file", reason = "the library writes no files" },
  { path = "std::fs::remove_dir", reason = "the library writes no files" },
  { path = "std::fs::remove_dir_all", reason = "the library writes no files" },
  { path = "std::fs::create_dir", reason = "the library writes no files" },
  { path = "std::fs::create_dir_all", reason = "the library writes no files" },
  { path = "std::fs::hard_link", reason = "the library writes no files" },
  { path = "std::fs::soft_link", reason = "the library writes no files" },
  { path = "std::fs::DirBuilder::new", reason = "the library writes no files" },
  { path = "std::fs::File::create", reason = "the library writes no files" },
  { path = "std::fs::File::create_new", reason = "the library writes no files" },
  { path = "std::fs::File::options", reason = "the library writes no files" },
  { path = "std::fs::OpenOptions::new", reason = "the library writes no files" },
  { path = "std::os::unix::fs::symlink", reason = "the library writes no files", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_file", reason = "the library writes no files", allow-invalid = true },
  { path = "std::os::windows::fs::symlink_dir", reason = "the library writes no files", allow-invalid = true },
]
